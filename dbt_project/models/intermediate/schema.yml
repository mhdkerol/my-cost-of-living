version: 2

models:
  - name: int_fuel_levels
    description: "Published pump prices (RM per litre), one row per effective_date, full history from 2017-03-30."
    columns:
      - name: effective_date
        data_tests: [not_null, unique]
      - name: ron95
        data_tests: [not_null]
      - name: ron97
        data_tests: [not_null]
      - name: diesel
        data_tests: [not_null]
      - name: diesel_eastmsia
        data_tests: [not_null]
      - name: _loaded_at
        data_tests: [not_null]
      - name: _source_url
        data_tests: [not_null]
